<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせフォーム</title>
<style>
:root{--bg:#fff;--fg:#1f1f1d;--sub:#5f5e5a;--line:#c9c7bd;--accent:#06c755;--accent-fg:#fff;--err:#b3261e;--card:#f7f6f2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--fg:#ecebe4;--sub:#b4b2a9;--line:#55544f;--err:#f2b8b5;--card:#262624}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 20px}
label,.lab{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.req{color:var(--err);font-size:12px;margin-left:4px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{min-height:120px;resize:vertical}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:8px;padding:12px;margin-top:20px;font-size:14px}
.consent input{margin-top:5px;width:18px;height:18px}
.consent a{color:inherit}
button{width:100%;margin-top:20px;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.error{color:var(--err);font-size:14px;margin-top:12px;min-height:1.2em}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.done{text-align:center;padding:48px 0}
.done h2{font-size:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div id="loading">読み込み中です…</div>

  <form id="form" hidden novalidate>
    <h1>お問い合わせ</h1>
    <p class="lead">ご入力いただいた内容は、担当者がご連絡する目的にのみ使用します。</p>

    <label for="name">お名前<span class="req">必須</span></label>
    <input id="name" type="text" maxlength="50" autocomplete="name">

    <label for="phone">電話番号<span class="req">必須</span></label>
    <input id="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="例：09012345678">

    <label for="email">メールアドレス（任意）</label>
    <input id="email" type="email" maxlength="100" autocomplete="email">

    <label for="job">希望職種<span class="req">必須</span></label>
    <select id="job">
      <option value="">選択してください</option>
      <option>事務</option>
      <option>軽作業・工場</option>
      <option>販売・接客</option>
      <option>IT・エンジニア</option>
      <option>その他</option>
    </select>

    <label for="area">希望勤務地（任意）</label>
    <input id="area" type="text" maxlength="100" placeholder="例：東京都内">

    <label for="start">希望開始時期<span class="req">必須</span></label>
    <select id="start">
      <option value="">選択してください</option>
      <option>すぐに</option>
      <option>1か月以内</option>
      <option>2〜3か月以内</option>
      <option>未定</option>
    </select>

    <label for="message">ご相談内容（任意）</label>
    <textarea id="message" maxlength="1000"></textarea>

    <div class="hp" aria-hidden="true"><input id="website" type="text" tabindex="-1" autocomplete="off"></div>

    <div class="consent">
      <input id="consent" type="checkbox">
      <label for="consent" style="margin:0;font-weight:400">
        <a href="PRIVACY_POLICY_URL" target="_blank" rel="noopener">個人情報の取り扱い</a>に同意します。
      </label>
    </div>

    <div id="error" class="error" role="alert"></div>
    <button id="submit" type="submit">送信する</button>
  </form>

  <div id="done" class="done" hidden>
    <h2>送信が完了しました</h2>
    <p>お問い合わせありがとうございます。<br>担当者より、あらためてご連絡いたします。</p>
    <button id="close" type="button">閉じる</button>
  </div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ▼ ここを書き換えてください ▼
var LIFF_ID = '2012457698-hzNCqd1P';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwI2XCKar0c82rHSBdo_dkB-aX4XhG10BKFoJpaglSQ65MWGX9bLOQBiZMkd4n3B6o5fw/exec';
// ▲ ここまで ▲

var $ = function (id) { return document.getElementById(id); };

liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  $('loading').hidden = true;
  $('form').hidden = false;
}).catch(function () {
  $('loading').textContent = '読み込みに失敗しました。LINEのアプリから開き直してください。';
});

$('close').addEventListener('click', function () {
  if (liff.isInClient()) liff.closeWindow(); else window.close();
});

$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  $('error').textContent = '';

  var data = {
    name: $('name').value.trim(),
    phone: $('phone').value.trim(),
    email: $('email').value.trim(),
    job: $('job').value,
    area: $('area').value.trim(),
    start: $('start').value,
    message: $('message').value.trim(),
    website: $('website').value,
    consent: $('consent').checked
  };

  var err = check(data);
  if (err) { $('error').textContent = err; return; }

  var idToken = liff.getIDToken();
  if (!idToken) { liff.login(); return; }

  $('submit').disabled = true;
  $('submit').textContent = '送信中…';

  // text/plain で送ると、ブラウザの事前確認（CORS preflight）が不要になります
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ idToken: idToken, data: data }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.ok) {
        $('form').hidden = true;
        $('done').hidden = false;
      } else {
        $('error').textContent = res.message || '送信に失敗しました。';
        reset();
      }
    })
    .catch(function () {
      $('error').textContent = '通信に失敗しました。電波の良い場所で、もう一度お試しください。';
      reset();
    });
});

function reset() {
  $('submit').disabled = false;
  $('submit').textContent = '送信する';
}

function check(d) {
  if (!d.name) return 'お名前を入力してください。';
  if (!d.phone) return '電話番号を入力してください。';
  if (!/^[0-9+\-() ]+$/.test(d.phone)) return '電話番号は数字で入力してください。';
  if (d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return 'メールアドレスの形式が正しくありません。';
  if (!d.job) return '希望職種を選んでください。';
  if (!d.start) return '希望開始時期を選んでください。';
  if (!d.consent) return '個人情報の取り扱いへの同意が必要です。';
  return '';
}
</script>
</body>
</html>
